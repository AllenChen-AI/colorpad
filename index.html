<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>揚名ColorPad</title>
<!-- PWA：這三行需要同資料夾的 manifest.webmanifest、icon-192.png；單獨開啟 HTML 時會被忽略，不影響使用 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffe9b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="揚名ColorPad">
<style>
/* ===================== 介面樣式 ===================== */
:root{ --btn:64px; --gap:6px; --bg:#fff7e6; --bar:#ffe9b8; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg);
  font-family:system-ui,-apple-system,sans-serif; user-select:none; -webkit-user-select:none;
  -webkit-touch-callout:none; overscroll-behavior:none; }

/* 直式：上工具列 / 畫布 / 色盤(平板) / 下工具列 */
#app{ position:fixed; inset:0; display:grid;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  grid-template-areas:"a" "s" "p" "b"; grid-template-rows:auto 1fr auto auto; grid-template-columns:1fr; }
/* 橫式：左側筆刷欄 / 上工具列+畫布 / 右側色盤(平板) */
@media (orientation:landscape){
  #app{ grid-template-areas:"b a p" "b s p"; grid-template-columns:auto 1fr auto; grid-template-rows:auto 1fr; }
}

.bar{ display:flex; gap:var(--gap); padding:6px; justify-content:space-between; align-items:center; background:var(--bar); }
#barA{ grid-area:a; }
#barB{ grid-area:b; }
@media (orientation:landscape){
  #barB{ flex-direction:column; justify-content:center; overflow-y:auto; }
}

button.t{ width:var(--btn); height:var(--btn); min-width:var(--btn); min-height:var(--btn); flex:0 0 auto;
  border:none; border-radius:18px; background:#fff; font-size:34px; line-height:1; padding:0;
  display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,.15);
  touch-action:manipulation; cursor:pointer; }
button.t:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
button.t.on{ background:#ffd34d; box-shadow:0 0 0 4px #ff9f1a; }
#sizeDot,#colorDot{ display:block; border-radius:50%; }
#colorDot{ width:44px; height:44px; border:3px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.2); }

/* 畫布區 */
#stage{ grid-area:s; position:relative; display:flex; align-items:center; justify-content:center;
  min-width:0; min-height:0; touch-action:none; }
#wrap{ position:relative; background:#fff; border-radius:16px; overflow:hidden; touch-action:none;
  box-shadow:0 4px 16px rgba(0,0,0,.12); }
#wrap canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

/* 色盤：手機隱藏(改用彈出面板)，平板直接攤開 */
#palette{ grid-area:p; display:none; }
body.tablet #palette{ display:grid; gap:6px; padding:8px; background:var(--bar); overflow:auto;
  grid-template-columns:repeat(auto-fill,var(--btn)); justify-content:center; max-height:38vh; }
@media (orientation:landscape){
  body.tablet #palette{ grid-template-columns:repeat(6,var(--btn)); max-height:none; align-content:start; }
}
body.tablet #colorBtn{ display:none; }
.sw{ width:var(--btn); height:var(--btn); border-radius:50%; border:3px solid rgba(0,0,0,.15);
  padding:0; cursor:pointer; touch-action:manipulation; }
.sw.on{ outline:5px solid #333; outline-offset:2px; }

/* 各種覆蓋層 */
.ov{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:20; }
.ov.show{ display:flex; }
#palOverlay,#brushOverlay,#homeOverlay{ background:rgba(0,0,0,.4); }
#palGrid,#brushGrid{ background:#fff; border-radius:20px; padding:14px; display:grid; gap:8px;
  grid-template-columns:repeat(auto-fill,var(--btn)); justify-content:center;
  width:min(92vw,560px); max-height:85vh; overflow:auto; }
#homeBox{ display:flex; flex-direction:column; align-items:center; gap:12px; max-width:94vw; max-height:92vh; }
#homeHead{ display:none; align-items:center; gap:14px; background:#fff; border-radius:20px; padding:8px 18px 8px 8px; }
#homeHead.show{ display:flex; }
#homeHead .title{ font-size:28px; font-weight:700; max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#brand{ display:flex; align-items:center; gap:12px; background:#fff; border-radius:20px; padding:6px 20px 6px 10px; }
#brand img{ height:min(17vmin,88px); width:auto; display:block; }
#brand .bn{ display:flex; flex-direction:column; line-height:1.25; }
#brand .bn b{ font-size:22px; color:#3f4670; }
#brand .bn span{ font-size:15px; color:#6a708f; }
#homeFoot{ display:flex; flex-direction:column; align-items:center; gap:6px; color:#fff; font-size:14px; text-shadow:0 1px 3px rgba(0,0,0,.6); }
#homeFoot .links{ display:flex; gap:14px; align-items:center; }
.lk{ position:relative; width:48px; height:48px; border-radius:50%; border:none; padding:0; color:#fff; font-weight:800; font-size:20px;
  cursor:pointer; touch-action:manipulation; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.lk.fb{ background:#1877f2; } .lk.ig{ background:linear-gradient(45deg,#fd5949,#d6249f 55%,#285aeb); }
.lk i{ position:absolute; left:0; bottom:0; height:100%; width:100%; background:rgba(255,255,255,.45); transform:scaleY(0); transform-origin:bottom; pointer-events:none; }
.hold i{ transform:scaleY(1); transition:transform 1.5s linear; }
#updBtn{ display:none; position:relative; overflow:hidden; border:none; border-radius:22px; padding:12px 22px; background:#ff9800; color:#fff;
  font-size:19px; font-weight:700; cursor:pointer; touch-action:manipulation; }
#updBtn.show{ display:block; }
#updBtn i{ position:absolute; left:0; top:0; bottom:0; width:100%; background:rgba(255,255,255,.35); transform:scaleX(0); transform-origin:left; pointer-events:none; }
#updBtn.hold i{ transform:scaleX(1); transition:transform 1.5s linear; }
#homeBtn.dot::after{ content:''; position:absolute; top:4px; right:4px; width:16px; height:16px; border-radius:50%; background:#ff3d00; border:2px solid #fff; }
#homeBtn{ position:relative; }
#hint{ position:fixed; left:50%; bottom:8vh; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:20px;
  font-size:18px; z-index:60; display:none; max-width:90vw; text-align:center; }
#hint.show{ display:block; }
#pages .empty{ color:#fff; font-size:22px; padding:30px; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.6); }
#pages{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; align-content:flex-start;
  overflow:auto; padding:12px; min-height:0; }
.page{ width:min(32vmin,210px); aspect-ratio:1; border:none; border-radius:24px; background:#fff;
  padding:10px; box-shadow:0 6px 0 rgba(0,0,0,.2); cursor:pointer; font-size:min(16vmin,96px); }
.page img{ width:100%; height:100%; display:block; object-fit:contain; }
.page.on{ box-shadow:0 0 0 6px #ff9f1a; }
.page.add{ background:#fff3c4; border:4px dashed #ffb300; }
.page img{ pointer-events:none; }
.page.folder{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:#e3f2ff; }
.page.cat{ background:#fff3d6; }
.page.folder .fico{ font-size:min(14vmin,84px); line-height:1; }
.page.folder .fname{ font-size:min(4.6vmin,22px); font-weight:700; max-width:100%; overflow:hidden; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-all; line-height:1.2; }
.page.newfolder{ background:#e3f2ff; border:4px dashed #4aa3ff; font-size:min(11vmin,64px); }
button.t.danger{ background:#ffb3b3; }
#pickOverlay,#nameOverlay,#actOverlay,#moveOverlay{ background:rgba(0,0,0,.5); z-index:30; }
#actBox{ background:#fff; border-radius:24px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:14px; max-width:92vw; }
#actPrev img{ width:min(46vmin,240px); height:min(46vmin,240px); object-fit:contain; border:2px solid #eee; border-radius:12px; display:block; }
#actPrev .fico{ font-size:72px; line-height:1; text-align:center; }
#actPrev .fname{ font-size:26px; font-weight:700; text-align:center; max-width:70vw; word-break:break-all; }
#actHint{ font-size:16px; color:#666; text-align:center; max-width:70vw; }
#actBtns{ display:flex; gap:28px; }
#moveBox{ background:#fff; border-radius:20px; padding:14px; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,120px);
  justify-content:center; width:min(92vw,620px); max-height:85vh; overflow:auto; }
#moveBox .page{ width:120px; padding:6px; }
#moveBox .page .fico{ font-size:44px; }
#moveBox .page .fname{ font-size:16px; }
#nameBox{ background:#fff; border-radius:24px; padding:20px; display:flex; flex-direction:column; align-items:center; gap:16px; width:min(90vw,420px); }
#nameIcon{ font-size:56px; line-height:1; }
#nameIn{ width:100%; font-size:28px; padding:12px 16px; border:3px solid #ffb300; border-radius:16px; outline:none;
  user-select:text; -webkit-user-select:text; }
#nameBtns{ display:flex; gap:32px; }
#pickBox{ background:#fff; border-radius:24px; padding:16px; display:flex; flex-direction:column; gap:14px; align-items:center; }
#pkSV{ width:min(86vw,340px); height:min(36vh,260px); border-radius:14px; touch-action:none; }
#pkHue{ width:min(86vw,340px); height:40px; border-radius:20px; touch-action:none; }
#pkRow{ display:flex; gap:14px; align-items:center; }
#pkPrev{ width:64px; height:64px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.25); }
#pkDel{ background:#ffb3b3; display:none; }
#pickBox.edit #pkDel{ display:flex; }
.sw.add{ background:conic-gradient(#f33,#fd3,#3d5,#3cf,#53f,#f3c,#f33); font-size:28px; display:flex; align-items:center; justify-content:center; }
#cheer{ pointer-events:none; }
#cheer .star{ font-size:40vmin; animation:pop 1.3s ease forwards; }
@keyframes pop{ 0%{transform:scale(.2) rotate(-30deg);opacity:0} 40%{transform:scale(1.1) rotate(10deg);opacity:1} 100%{transform:scale(1);opacity:0} }
#loading{ background:var(--bg); z-index:50; }
#loading{ flex-direction:column; gap:18px; }
#loading img{ width:min(60vw,260px); }
#loading .nm{ font-size:22px; color:#3f4670; font-weight:700; }
#loading .spin{ font-size:56px; animation:sp 1s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="barA">
    <button class="t" id="homeBtn" aria-label="首頁">🏠</button>
    <button class="t" id="undoBtn" aria-label="復原">↩️</button>
    <button class="t" id="clearBtn" aria-label="清除">🗑️</button>
    <button class="t" id="sizeBtn" aria-label="粗細"><span id="sizeDot"></span></button>
    <button class="t" id="doneBtn" aria-label="完成">✅</button>
  </div>
  <div id="stage">
    <div id="wrap">
      <canvas id="paint"></canvas>  <!-- 顏料層（最下） -->
      <canvas id="live"></canvas>   <!-- 正在畫的這一筆 -->
      <canvas id="line"></canvas>   <!-- 線稿層（最上） -->
    </div>
  </div>
  <div id="palette"></div>
  <div class="bar" id="barB">
    <button class="t" id="colorBtn" aria-label="顏色"><span id="colorDot"></span></button>
  </div>
</div>
<div id="palOverlay" class="ov"><div id="palGrid"></div></div>
<div id="brushOverlay" class="ov"><div id="brushGrid"></div></div>
<div id="homeOverlay" class="ov"><div id="homeBox"><div id="brand"><img src="logo.png" alt="揚名創思空間"><div class="bn"><b>揚名 ColorPad</b><span>揚名創思空間</span></div></div><button id="updBtn">🔄 有新版本！請爸爸媽媽長按 1.5 秒更新<i></i></button><div id="homeHead"></div><div id="pages"></div>
<div id="homeFoot"><div class="links"><button class="lk fb" id="lkFb" aria-label="Facebook 粉絲專頁（長按開啟）">f<i></i></button><button class="lk ig" id="lkIg" aria-label="Instagram（長按開啟）">IG<i></i></button></div><div>© 2026 揚名創思空間 All rights reserved</div><div style="font-size:12px;opacity:.85">連結請爸爸媽媽長按約 1.5 秒開啟</div></div></div></div>
<div id="hint"></div>
<div id="actOverlay" class="ov"><div id="actBox"><div id="actPrev"></div><div id="actHint"></div><div id="actBtns"></div></div></div>
<div id="moveOverlay" class="ov"><div id="moveBox"></div></div>
<div id="nameOverlay" class="ov"><div id="nameBox"><div id="nameIcon">📁</div><input id="nameIn" maxlength="20" placeholder="名稱" autocomplete="off"><div id="nameBtns"><button class="t" id="nameNo" aria-label="取消">❌</button><button class="t" id="nameYes" aria-label="確定">✅</button></div></div></div>
<div id="pickOverlay" class="ov"><div id="pickBox"><canvas id="pkSV"></canvas><canvas id="pkHue"></canvas><div id="pkRow"><div id="pkPrev"></div><button class="t" id="pkNo" aria-label="取消">❌</button><button class="t" id="pkDel" aria-label="刪除顏色">🗑️</button><button class="t" id="pkYes" aria-label="確定">✅</button></div></div></div>
<input type="file" id="fileIn" accept="image/png,image/jpeg" hidden>
<div id="cheer" class="ov"><div class="star">⭐</div></div>
<div id="loading" class="ov show"><img src="logo.png" alt=""><div class="nm">揚名 ColorPad</div><div class="spin">🎨</div></div>

<script>
/* ===================== 內建線稿：用簡單形狀組合（座標 0~100），由後往前畫，後畫的蓋住先畫的 ===================== */
const ART = (() => {
  const ell = (x, y, a, b) => `M${x - a} ${y}a${a} ${b} 0 1 0 ${2 * a} 0a${a} ${b} 0 1 0 ${-2 * a} 0z`;
  const cir = (x, y, r) => ell(x, y, r, r);
  const rect = (x, y, w, h, r = 0) => r
    ? `M${x + r} ${y}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}v${h - 2 * r}a${r} ${r} 0 0 1 ${-r} ${r}h${-(w - 2 * r)}a${r} ${r} 0 0 1 ${-r} ${-r}v${-(h - 2 * r)}a${r} ${r} 0 0 1 ${r} ${-r}z`
    : `M${x} ${y}h${w}v${h}h${-w}z`;
  const poly = (...p) => { let s = 'M' + p[0] + ' ' + p[1]; for (let i = 2; i < p.length; i += 2) s += 'L' + p[i] + ' ' + p[i + 1]; return s + 'z'; };
  // 星形／花瓣用：n 個尖，外半徑 R、內半徑 r
  const star = (x, y, R, r, n, rot = -90) => {
    const p = [];
    for (let i = 0; i < n * 2; i++) { const a = (rot + i * 180 / n) * Math.PI / 180, q = i % 2 ? r : R; p.push((x + q * Math.cos(a)).toFixed(1), (y + q * Math.sin(a)).toFixed(1)); }
    return poly(...p);
  };
  // 波浪邊緣的圓（獅子鬃毛、雲）：n 個圓弧凸起
  const bumpy = (x, y, R, n, h) => {
    let s = '';
    for (let i = 0; i < n; i++) {
      const a0 = i * 2 * Math.PI / n, a1 = (i + 1) * 2 * Math.PI / n, am = (a0 + a1) / 2;
      const P = (a, q) => (x + q * Math.cos(a)).toFixed(1) + ' ' + (y + q * Math.sin(a)).toFixed(1);
      if (i === 0) s += 'M' + P(a0, R);
      s += 'Q' + P(am, R + h) + ' ' + P(a1, R);
    }
    return s + 'z';
  };
  // 花瓣圈：n 片橢圓花瓣繞中心
  const F = d => ['f', d], L = d => ['l', d], K = d => ['k', d];
  const M = (m, ops) => ['g', m, ops];
  const rot = (deg, cx, cy, ...ops) => {
    const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return M([c, s, -s, c, cx - c * cx + s * cy, cy - s * cx - c * cy], ops);
  };
  const flip = (...ops) => M([-1, 0, 0, 1, 100, 0], ops);           // 左右鏡像（以 x=50 為軸）
  const flipAt = (cx, ...ops) => M([-1, 0, 0, 1, 2 * cx, 0], ops);
  const at = (dx, dy, ...ops) => M([1, 0, 0, 1, dx, dy], ops);
  const sc = (k, cx, cy, ...ops) => M([k, 0, 0, k, cx - k * cx, cy - k * cy], ops);
  const Fe = (x, y, a, b, deg) => rot(deg, x, y, F(ell(x, y, a, b)));
  const eyes = (x, y, r = 2.2) => [K(cir(50 - x, y, r)), K(cir(50 + x, y, r))];
  const petals = (x, y, n, len, w, off, ...extra) => {      // n 片花瓣（橢圓）繞 (x,y)，花瓣中心離中心 off
    const o = [];
    for (let i = 0; i < n; i++) o.push(rot(i * 360 / n, x, y, F(ell(x, y - off, w, len))));
    return o;
  };
  function run(ctx, ops) {
    for (const o of ops) {
      if (o[0] === 'g') { ctx.save(); ctx.transform(...o[1]); run(ctx, o[2]); ctx.restore(); }
      else if (Array.isArray(o[0])) run(ctx, o);
      else {
        const p = new Path2D(o[1]);
        if (o[0] === 'l') ctx.stroke(p);
        else { ctx.fillStyle = o[0] === 'k' ? '#000' : '#fff'; ctx.fill(p); ctx.stroke(p); }
      }
    }
  }
  // 在白底 canvas 上畫出一張圖（size＝邊長 px，lw＝線寬 px）
  function render(ctx, size, lw, item) {
    ctx.save();
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    ctx.translate(size * 0.04, size * 0.04); ctx.scale(size * 0.92 / 100, size * 0.92 / 100);   // 四周留白
    ctx.lineWidth = lw * 100 / (size * 0.92); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
    if (item.glyph) {
      const FONT = '"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC","Arial Rounded MT Bold",system-ui,sans-serif';
      let fs = 100; ctx.font = `900 ${fs}px ${FONT}`;
      let m = ctx.measureText(item.glyph);
      const w = m.width, h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      fs = fs * Math.min(70 / Math.max(w, 1), 76 / Math.max(h, 1)); ctx.font = `900 ${fs}px ${FONT}`;
      m = ctx.measureText(item.glyph);
      const x = 50, y = 50 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth *= 2; ctx.strokeText(item.glyph, x, y);
      ctx.fillStyle = '#fff'; ctx.fillText(item.glyph, x, y);
    } else run(ctx, item.ops());
    ctx.restore();
  }
  const H = { Fe, ell, cir, rect, poly, star, bumpy, F, L, K, rot, flip, flipAt, at, sc, eyes, petals, M };
  return { H, render, run, cats: [] };
})();

(() => {
  const { Fe, ell, cir, rect, poly, star, bumpy, F, L, K, rot, flip, flipAt, at, sc, eyes, petals } = ART.H;
  const it = (id, name, ops) => ({ id, name, ops });
  const items = [
    it('cat', '貓', () => [
      F('M70 86C98 88 100 56 84 50C92 62 90 78 68 76z'),
      F(ell(50, 76, 22, 20)), F(ell(50, 80, 11, 13)),
      F(ell(38, 94, 9, 5)), F(ell(62, 94, 9, 5)),
      F(poly(25, 40, 29, 10, 47, 26)), F(poly(75, 40, 71, 10, 53, 26)),
      F(poly(31, 30, 32, 18, 40, 26)), F(poly(69, 30, 68, 18, 60, 26)),
      F(ell(50, 42, 27, 22)),
      ...eyes(11, 40, 2.6), K(poly(47, 47, 53, 47, 50, 50.5)),
      L('M50 50.5v3M50 53.5q-4 4 -8 1M50 53.5q4 4 8 1'),
      L('M28 46l-14 -3M28 51l-14 3M72 46l14 -3M72 51l14 3'),
      L('M50 21v6M43 22.5l1.5 5M57 22.5l-1.5 5')
    ]),
    it('dog', '狗', () => [
      F('M70 88C88 86 90 66 84 58C82 68 76 74 66 74z'),
      F(ell(50, 78, 20, 18)), F(ell(40, 95, 8, 4.5)), F(ell(60, 95, 8, 4.5)),
      F(ell(50, 42, 22, 20)),
      F('M33 26C16 24 12 52 20 60C30 64 34 48 34 36z'), F('M67 26C84 24 88 52 80 60C70 64 66 48 66 36z'),
      F(ell(50, 52, 11, 9)), K(cir(40, 36, 2.4)), K(cir(60, 36, 2.4)),
      K(ell(50, 47, 4.5, 3)), L('M50 50v6M50 56q-4 4 -8 0M50 56q4 4 8 0'),
      F('M47 57q3 10 6 0z'), F(ell(60, 33, 7, 5.5)), K(cir(60, 35, 2.4))
    ]),
    it('rabbit', '兔子', () => [

<script>
'use strict';
/* ===================== 1. 基本設定 ===================== */
const $ = id => document.getElementById(id);
const SPLASH_UNTIL = performance.now() + 1500;
const DPR = window.devicePixelRatio || 1;
// 畫布內部解析度固定（依螢幕短邊 × DPR），轉螢幕只縮放顯示，不會變形或遺失顏色
const S = Math.max(1024, Math.min(2048, Math.round(Math.min(screen.width, screen.height) * DPR)));
const GAP = Math.max(2, Math.round(S / 400));   // 線條加粗幾像素來補小缺口
const LINE_PX = Math.round(S * 0.014);                  // 線稿的線寬（和 drawApple 的 lineWidth 一致）

const SIZES = [0.015, 0.035, 0.07];             // 三段粗細（相對畫布寬）
const DOT_PX = [12, 22, 34];                     // 粗細按鈕上圓點大小

const paint = $('paint'), live = $('live'), line = $('line'), wrap = $('wrap'), stage = $('stage');

const lctx = live.getContext('2d');

const stroke = document.createElement('canvas');   // 暫存一筆的筆觸（區域大小）

const state = { tool: 'crayon', lastBrush: 'crayon', color: null, sizeIdx: 1 };

/* ===================== 2. 48 色 ===================== */
const COLORS = (() => {
  const hues = [0, 20, 40, 55, 80, 120, 160, 190, 210, 240, 275, 320];
  const out = [];
  for (const [s, l] of [[90, 80], [85, 55], [80, 35]])
    for (const h of hues) out.push(`hsl(${h},${s}%,${l}%)`);
  out.push('#ffffff', '#d6d6d6', '#9e9e9e', '#616161', '#333333', '#000000',
           '#ffe0c7', '#f1c27d', '#d29a5c', '#a0522d', '#6d3b1e', '#3e2312');
  return out;   // 共 48 色
})();
state.color = COLORS[12];

/* ===================== 3. 線稿：程式繪製的蘋果 ===================== */
function drawApple(ctx) {
  ctx.clearRect(0, 0, S, S);
  ctx.save();
  ctx.scale(S, S);
  ctx.lineWidth = 0.014; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#222';
  // 果身（兩個圓弧的蘋果形）
  ctx.beginPath();
  ctx.moveTo(.5, .32);
  ctx.bezierCurveTo(.62, .22, .86, .26, .86, .52);
  ctx.bezierCurveTo(.86, .74, .70, .90, .60, .90);
  ctx.bezierCurveTo(.55, .90, .53, .87, .5, .87);
  ctx.bezierCurveTo(.47, .87, .45, .90, .40, .90);
  ctx.bezierCurveTo(.30, .90, .14, .74, .14, .52);
  ctx.bezierCurveTo(.14, .26, .38, .22, .5, .32);

  // 果梗
  ctx.beginPath();
  ctx.moveTo(.485, .315);
  ctx.quadraticCurveTo(.475, .20, .44, .115);
  ctx.lineTo(.475, .10);
  ctx.quadraticCurveTo(.515, .19, .52, .30);
  ctx.closePath(); ctx.stroke();
  // 葉子
  ctx.beginPath();
  ctx.moveTo(.505, .20);
  ctx.quadraticCurveTo(.58, .06, .78, .10);
  ctx.quadraticCurveTo(.70, .25, .505, .20);
  ctx.closePath(); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(.54, .19); ctx.lineTo(.70, .135); ctx.stroke();
  // 反光
  ctx.beginPath(); ctx.ellipse(.29, .47, .04, .085, -0.35, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* ===================== 4. 填色：區域計算 ===================== */
let wall = null, labels = null, regionArea = [], regionBox = [];
const maskCache = new Map();

// 二值圖膨脹（加粗），用滑動視窗，速度快
function dilate(src, w, h, r) {
  const tmp = new Uint8Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = y * w; let cnt = 0;
    for (let x = 0; x < Math.min(r, w); x++) cnt += src[row + x];
    for (let x = 0; x < w; x++) {
      if (x + r < w) cnt += src[row + x + r];
      if (x - r - 1 >= 0) cnt -= src[row + x - r - 1];
      tmp[row + x] = cnt > 0 ? 1 : 0;
    }
  }
  for (let x = 0; x < w; x++) {
    let cnt = 0;
    for (let y = 0; y < Math.min(r, h); y++) cnt += tmp[y * w + x];
    for (let y = 0; y < h; y++) {
      if (y + r < h) cnt += tmp[(y + r) * w + x];
      if (y - r - 1 >= 0) cnt -= tmp[(y - r - 1) * w + x];

// 讀線稿 → 加粗補洞 → 把每個封閉區域編號（flood fill）
function buildRegions() {
  const d = nctx.getImageData(0, 0, S, S).data;
  const w0 = new Uint8Array(S * S);
  for (let i = 0; i < S * S; i++) w0[i] = d[i * 4 + 3] > 80 ? 1 : 0;

  regionArea = [0]; regionBox = [null];
  let n = 0;
  for (let i = 0; i < S * S; i++) {
    if (wall[i] || labels[i]) continue;
    n++;
    let sp = 0, area = 0, x0 = S, y0 = S, x1 = 0, y1 = 0;
    stack[sp++] = i; labels[i] = n;
    while (sp) {
      const j = stack[--sp], x = j % S, y = (j / S) | 0;
      area++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      let k;
      if (x > 0     && !wall[k = j - 1] && !labels[k]) { labels[k] = n; stack[sp++] = k; }
      if (x < S - 1 && !wall[k = j + 1] && !labels[k]) { labels[k] = n; stack[sp++] = k; }
      if (y > 0     && !wall[k = j - S] && !labels[k]) { labels[k] = n; stack[sp++] = k; }
      if (y < S - 1 && !wall[k = j + S] && !labels[k]) { labels[k] = n; stack[sp++] = k; }
    }
    regionArea.push(area); regionBox.push({ x0, y0, x1, y1 });
  }

}

// 找手指所在的區域；按在黑線上時，往外找最近的區域
function regionAt(x, y) {
  x = Math.round(x); y = Math.round(y);
  const R = Math.round(S * 0.02);
  for (let r = 0; r <= R; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= S || yy >= S) continue;
      const id = labels[yy * S + xx];
      if (id && regionArea[id] > 50) return id;
    }
  }
  return 0;
}

// 產生區域遮罩（稍微擴大到黑線底下，避免顏色和線之間留白縫）
function getMask(id) {
  if (maskCache.has(id)) return maskCache.get(id);
  if (regionArea[id] === S * S) {                       // 空白畫布：整張都能畫
    const c = document.createElement('canvas'); c.width = c.height = S;
    const cx = c.getContext('2d'); cx.fillStyle = '#000'; cx.fillRect(0, 0, S, S);
    const m0 = { canvas: c, x: 0, y: 0, w: S, h: S }; maskCache.set(id, m0); return m0;
  }
  const b = regionBox[id], pad = FILL_R + 2;
  const x = Math.max(0, b.x0 - pad), y = Math.max(0, b.y0 - pad);
  const w = Math.min(S, b.x1 + pad + 1) - x, h = Math.min(S, b.y1 + pad + 1) - y;
  let a = new Uint8Array(w * h);
  for (let yy = 0; yy < h; yy++) {
    const src = (yy + y) * S + x, dst = yy * w;
    for (let xx = 0; xx < w; xx++) if (labels[src + xx] === id) a[dst + xx] = 1;
  }
  a = dilate(a, w, h, FILL_R);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'), img = cx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) if (a[i]) img.data[i * 4 + 3] = 255;
  cx.putImageData(img, 0, 0);
  const m = { canvas: c, x, y, w, h };
  maskCache.set(id, m);
  return m;
}

/* ===================== 5. 筆刷（新增筆刷只要在這裡加一項） ===================== */
// begin：設定筆刷樣式；seg：畫一小段；alpha：整筆的透明度
const patCache = new Map();

  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0, 0, 64, 64);
  const d = x.getImageData(0, 0, 64, 64);
  for (let i = 0; i < 64 * 64; i++) {
    const r = Math.random();
    if (r < 0.22) d.data[i * 4 + 3] = 0; else if (r < 0.45) d.data[i * 4 + 3] = 150;
  }
  x.putImageData(d, 0, 0);

const rnd = (a, b) => a + Math.random() * (b - a);

// 沿著線段，每隔 step 像素呼叫一次 fn(x, y)（印章類筆刷用）
function stampAlong(a, b, step, fn) {
  if (bs.first) { bs.first = false; fn(a.x, a.y); return; }
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d < 1e-6) return;

    const ang = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;

    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);

  ctx.beginPath(); ctx.moveTo(x, y + r * 0.95);
  ctx.bezierCurveTo(x - r * 1.5, y - r * 0.1, x - r * 0.75, y - r * 1.15, x, y - r * 0.4);

  ctx.quadraticCurveTo(x + k, y - k, x + r, y); ctx.quadraticCurveTo(x + k, y + k, x, y + r);

// ---- 筆刷清單（新增筆刷：在下面加一項 {icon, alpha, begin, seg} 即可）----
const BRUSHES = {

    begin(ctx, color, w) { ctx.lineWidth = w; ctx.strokeStyle = crayonPattern(color); ctx.shadowBlur = 0; },
    seg: lineSeg

  marker: {   // 麥克筆：平滑實色

    begin(ctx, color, w) { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.shadowBlur = 0; },
    seg: lineSeg

function exportBlob(blob) {
  const t = new Date(), pad = n => String(n).padStart(2, '0');
  const name = `著色-${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}-${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}.png`;
  let file = null;
  try { file = new File([blob], name, { type: 'image/png' }); } catch (_) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).catch(err => { if (!err || err.name !== 'AbortError') download(blob, name); });
  } else download(blob, name);
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function cheer(icon) {
  const c = $('cheer'), s = c.firstElementChild; s.textContent = icon || '⭐';
  c.classList.add('show'); s.style.animation = 'none'; void s.offsetWidth; s.style.animation = '';
  clearTimeout(cheer.t); cheer.t = setTimeout(() => c.classList.remove('show'), 1300);
}

const MIN_LINE = Math.round(S * 0.008);              // 匯入線稿的最細線寬，太細會自動加粗
const pages = [{ name: '蘋果', draw: drawApple, key: 'apple', folderId: 'cat:fruit' }, { name: '空白畫布', blank: true, key: 'blank' }];   // 頁面清單：內建 + 匯入

function setLineWidth(px) { FILL_R = GAP + Math.max(1, Math.round(px * 0.6)); }

// 空白畫布：沒有線稿，整張都能畫
function setBlank() {
  nctx.clearRect(0, 0, S, S); setLineWidth(LINE_PX);
  labels = new Int32Array(S * S).fill(1); wall = null;
  regionArea = [0, S * S]; regionBox = [null, { x0: 0, y0: 0, x1: S - 1, y1: S - 1 }];
  maskCache.clear();
}
// 內建線稿：用形狀組合畫在白底上，再把「黑的程度」轉成線條透明度（和匯入線稿同樣的做法）
function drawArt(item) {
  const t = document.createElement('canvas'); t.width = t.height = S;
  const x = t.getContext('2d', { willReadFrequently: true });
  ART.render(x, S, LINE_PX, item);
  const im = x.getImageData(0, 0, S, S), d = im.data;
  for (let i = 0; i < d.length; i += 4) { d[i + 3] = 255 - d[i]; d[i] = d[i + 1] = d[i + 2] = 34; }
  nctx.clearRect(0, 0, S, S); nctx.putImageData(im, 0, 0);
}
// 載入第 i 頁：畫線稿 → 計算區域 → 清空顏料與復原（成功回傳 true）
async function loadPage(i) {
  $('loading').classList.add('show');
  await flushSave();                                  // 先把目前這張畫到一半的存好
  await new Promise(r => setTimeout(r, 30));          // 讓轉圈圈先顯示
  try {
    const pg = pages[i];
    if (pg.blank) setBlank();
    else {
      if (pg.draw) { pg.draw(nctx); setLineWidth(LINE_PX); }
      else if (pg.art) { drawArt(pg.art); setLineWidth(LINE_PX); }
      else setLineWidth(await drawImported(pg.blob));
      buildRegions();
    }
    pctx.clearRect(0, 0, S, S); lctx.clearRect(0, 0, S, S);
    undoStack.length = 0; undoBytes = 0;
    await restoreDraft(pg);                           // 讀回上次畫到一半的內容
    pg.thumb = pg.blank ? null : makeThumb();
    curPage = i; curPg = pg;
    try { const k = draftKey(pg); if (k) localStorage.setItem('coloring-last', k); } catch (_) {}
    return true;
  } catch (err) {
    console.warn(err);
    if (pages[i].blob) { pages.splice(i, 1); if (i < curPage) curPage--; }   // 讀不到的匯入線稿從清單移除，保留原本的畫
    cheer('❌');
    return false;
  } finally {
    const wait = SPLASH_UNTIL - performance.now();           // 開啟 App 時，Logo 畫面至少停留 1.5 秒
    if (wait > 0) setTimeout(() => $('loading').classList.remove('show'), wait);
    else $('loading').classList.remove('show');
  }
}

function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法讀取圖片')); };
    img.src = url;
  });
}

// 把匯入的圖片處理成線稿，回傳線寬
async function drawImported(file) {
  const img = await loadImg(file);
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) throw new Error('空白圖片');
  // 1. 白底、等比縮放、置中（四周留 4% 邊）
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
  const m = S * 0.04, k = Math.min((S - 2 * m) / iw, (S - 2 * m) / ih), dw = iw * k, dh = ih * k;
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, (S - dw) / 2, (S - dh) / 2, dw, dh);
  // 2. 深色變黑線、淺色變透明（保留柔邊，JPG 的淺色雜點會被濾掉）
  const id = x.getImageData(0, 0, S, S), d = id.data, LO = 90, HI = 200;
  for (let i = 0; i < d.length; i += 4) {
    const L = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    d[i + 3] = L <= LO ? 255 : L >= HI ? 0 : Math.round(255 * (HI - L) / (HI - LO));
    d[i] = d[i + 1] = d[i + 2] = 34;
  }
  x.putImageData(id, 0, 0);
  // 3. 量線寬；太細就加粗（同時讓補洞和上色更穩）
  let t = measureLine(d);
  nctx.clearRect(0, 0, S, S);
  if (t < MIN_LINE) {
    const r = Math.min(Math.ceil((MIN_LINE - t) / 2), Math.round(S * 0.01));
    thicken(nctx, c, r);
    t += 2 * r;
  } else nctx.drawImage(c, 0, 0);
  return t;
}

// 估計平均線寬：線條面積 ÷ 邊緣長度 × 2
function measureLine(d) {
  let area = 0, edge = 0;
  for (let y = 1; y < S - 1; y++) for (let x = 1; x < S - 1; x++) {
    const i = y * S + x;
    if (d[i * 4 + 3] <= 80) continue;
    area++;
    if (d[(i - 1) * 4 + 3] <= 80 || d[(i + 1) * 4 + 3] <= 80 || d[(i - S) * 4 + 3] <= 80 || d[(i + S) * 4 + 3] <= 80) edge++;
  }
  if (!area) throw new Error('找不到線條');
  if (area > S * S * 0.6) throw new Error('太暗，不像白底線稿');
  return 2 * area / edge;
}

// 線條加粗：把線稿往四周錯開疊畫（保留柔邊）
function thicken(ctx, src, r) {
  for (const rr of new Set([r, Math.ceil(r / 2)])) {
    const n = Math.max(8, Math.ceil(2 * Math.PI * rr));
    for (let k = 0; k < n; k++) { const a = k * 2 * Math.PI / n; ctx.drawImage(src, Math.cos(a) * rr, Math.sin(a) * rr); }
  }
  ctx.drawImage(src, 0, 0);
}

function makeThumb() {
  const t = document.createElement('canvas'); t.width = t.height = 300;
  const tx = t.getContext('2d'); tx.fillStyle = '#fff'; tx.fillRect(0, 0, 300, 300); tx.drawImage(line, 0, 0, 300, 300);
  return t.toDataURL();
}

// IndexedDB 小工具：資料庫 coloring-book（版本 2），倉庫 pages（線稿）、folders（資料夾）
const DB = (() => {
  let dbp = null;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('coloring-book', 3);
        r.onupgradeneeded = () => {
          const d = r.result;
          for (const s of ['pages', 'folders', 'works'])
            if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id', autoIncrement: true });
          if (!d.objectStoreNames.contains('workimg')) d.createObjectStore('workimg', { keyPath: 'id' });   // 作品原圖
          for (const s of ['drafts', 'draftmeta'])                                                         // 畫到一半的圖
            if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'key' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('db open'));
        r.onblocked = () => rej(new Error('db blocked'));
      } catch (e) { rej(e); }
    }).catch(e => { dbp = null; throw e; });
    return dbp;
  }
  const run = (store, mode, fn) => open().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq.result);
    tx.onerror = tx.onabort = () => rej(tx.error || new Error('db tx'));
  }));
  return {
    all: s => run(s, 'readonly', o => o.getAll()),
    get: (s, k) => run(s, 'readonly', o => o.get(k)),
    add: (s, rec) => run(s, 'readwrite', o => o.add(rec)),
    put: (s, rec) => run(s, 'readwrite', o => o.put(rec)),
    del: (s, id) => run(s, 'readwrite', o => o.delete(id))
  };
})();


/* ===================== 自動保存（畫到一半）與「我的作品」 ===================== */
let curPg = null, dirty = false, saveT = null, saving = Promise.resolve(), persistAsked = false;
const drafts = new Map();                              // 有存檔的頁面 key → { thumb }
let works = [];                                        // 完成的作品 { id, thumb, created }
let view = null;                                       // 首頁目前顯示：null＝線稿，'works'＝我的作品
const draftKey = pg => pg.key ? pg.key : pg.id != null ? 'p' + pg.id : null;
function markDirty() { dirty = true; clearTimeout(saveT); saveT = setTimeout(flushSave, 1000); }
function compose(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
  x.drawImage(paint, 0, 0, size, size); x.drawImage(line, 0, 0, size, size);
  return c;
}
function askPersist() {
  if (persistAsked) return; persistAsked = true;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
function flushSave() {
  clearTimeout(saveT);
  if (!dirty) return saving;
  if (!curPg || curPg.gone) { dirty = false; return saving; }
  const key = draftKey(curPg);
  if (!key) { saveT = setTimeout(flushSave, 800); return saving; }      // 匯入的線稿還沒拿到編號，稍後再存
  dirty = false;
  const thumb = compose(300).toDataURL('image/jpeg', 0.8);             // 以下兩行同步取得畫面，之後換頁也不會存錯
  const blobP = new Promise(r => paint.toBlob(r, 'image/png'));
  saving = saving.then(async () => {
    try {
      const blob = await blobP; if (!blob) throw new Error('toBlob');
      await DB.put('drafts', { key, blob });
      await DB.put('draftmeta', { key, thumb, updated: Date.now() });
      drafts.set(key, { thumb }); askPersist();
    } catch (err) { console.warn(err); }
  });
  return saving;
}
async function restoreDraft(pg) {
  const k = draftKey(pg); if (!k || !drafts.has(k)) return;
  try {
    const rec = await DB.get('drafts', k);
    if (rec && rec.blob) pctx.drawImage(await loadImg(rec.blob), 0, 0, S, S);
  } catch (err) { console.warn(err); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
addEventListener('pagehide', () => { flushSave(); });

// ✅ 完成：存進「我的作品」（之後可在首頁回頭看、存到相簿）；畫面保留，可以繼續畫
async function finishWork() {
  flushSave();
  const full = compose(S), th = compose(300).toDataURL('image/jpeg', 0.8);

async function askWorkAction(w) {
  let blob = null;
  try { const r = await DB.get('workimg', w.id); blob = r && r.blob; } catch (err) { console.warn(err); }
  const im = document.createElement('img'); im.alt = ''; im.src = blob ? URL.createObjectURL(blob) : w.thumb;

async function deleteWork(w) {

function quickThumb(pg) {                              // 內建線稿的縮圖（還沒載入過也能顯示）
  const t = document.createElement('canvas'); t.width = t.height = 300;
  const x = t.getContext('2d');
  if (pg.art) { ART.render(x, 300, 300 * 0.014, pg.art); return t.toDataURL(); }
  x.fillStyle = '#fff'; x.fillRect(0, 0, 300, 300);
  x.scale(300 / S, 300 / S); pg.draw(x); return t.toDataURL();
}

// 匯入前先縮到最長邊 2048、墊白底，存成小檔（原檔之後刪掉也沒關係）
async function normalizeFile(file) {
  const img = await loadImg(file);
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) throw new Error('空白圖片');
  const k = Math.min(1, 2048 / Math.max(iw, ih));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(iw * k)); c.height = Math.max(1, Math.round(ih * k));
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, 'image/png'));
  if (blob && blob.size > 2.5e6) blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  if (!blob) throw new Error('無法轉換圖片');
  return blob;
}

  if (!f) return;
  $('homeOverlay').classList.remove('show');
  $('loading').classList.add('show');
  let blob;
  try { blob = await normalizeFile(f); }
  catch (err) { console.warn(err); $('loading').classList.remove('show'); cheer('❌'); return; }
  const pg = { name: '匯入', blob, created: Date.now(), folderId: typeof curFolder === 'number' ? curFolder : null };   // 匯入到目前瀏覽的資料夾
  pages.push(pg);
  if (await loadPage(pages.length - 1)) saveNew(pg);
};

/* ---- 輸入名稱（資料夾命名用） ---- */
let nameRes = null;
function askName(icon, initial) {
  return new Promise(res => {
    nameRes = res; $('nameIcon').textContent = icon;
    const i = $('nameIn'); i.value = initial || '';
    $('nameOverlay').classList.add('show');
    setTimeout(() => { i.focus(); i.select(); }, 60);
  });
}
function endName(v) { $('nameOverlay').classList.remove('show'); const r = nameRes; nameRes = null; if (r) r(v); }
$('nameNo').onclick = () => endName(null);
$('nameYes').onclick = () => endName($('nameIn').value.trim());
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('nameYes').click(); } });

/* ---- 長按後的選單：❌ 取消 ＋ 各種動作 ---- */
function closeAct() { $('actOverlay').classList.remove('show'); }
$('actOverlay').onclick = e => { if (e.target.id === 'actOverlay') closeAct(); };
function showAction(prev, hint, btns) {
  const pv = $('actPrev'); pv.innerHTML = ''; pv.appendChild(prev);
  $('actHint').textContent = hint || '';
  const row = $('actBtns'); row.innerHTML = '';
  row.appendChild(mkBtn('❌', '取消', closeAct));
  for (const b of btns) row.appendChild(mkBtn(b.icon, b.label, () => { closeAct(); b.fn(); }, b.cls));
  $('actOverlay').classList.add('show');
}
function askPageAction(pg) {
  const im = document.createElement('img'); im.src = pg.thumb || ''; im.alt = '';
  showAction(im, '', [
    { icon: '📁', label: '移動到資料夾', fn: () => askMove(pg) },
    { icon: '🗑️', label: '刪除', cls: 'danger', fn: () => deletePage(pg) }
  ]);
}
function askFolderAction(fd) {
  const d = document.createElement('div'); d.innerHTML = '<div class="fico">📁</div><div class="fname"></div>';
  d.lastChild.textContent = fd.name;
  showAction(d, '刪除資料夾後，裡面的線稿會回到首頁', [
    { icon: '✏️', label: '改名', fn: () => renameFolder(fd) },
    { icon: '🗑️', label: '刪除資料夾', cls: 'danger', fn: () => deleteFolder(fd) }
  ]);
}

/* ---- 資料夾：新增、改名、刪除、移動線稿 ---- */
async function createFolder(name) {
  const f = { name, created: Date.now() };
  try { f.id = await DB.add('folders', { name, created: f.created }); }
  catch (err) { console.warn(err); f.id = -Date.now(); cheer('⚠️'); }   // 存不進資料庫：這次先放在記憶體
  folders.push(f);
  return f;
}
async function renameFolder(fd) {
  const n = await askName('📁', fd.name);
  if (!n) return;
  fd.name = n;
  try { if (fd.id > 0) await DB.put('folders', { id: fd.id, name: fd.name, created: fd.created }); } catch (err) { console.warn(err); cheer('⚠️'); }
  renderPages();
}
async function deleteFolder(fd) {
  try {
    for (const pg of pages) if (pg.folderId === fd.id) { pg.folderId = null; if (pg.id != null) await DB.put('pages', pageRec(pg)); }
    if (fd.id > 0) await DB.del('folders', fd.id);
  } catch (err) { console.warn(err); cheer('⚠️'); }
  folders.splice(folders.indexOf(fd), 1);
  if (curFolder === fd.id) curFolder = null;
  renderPages();
}
function askMove(pg) {
  const g = $('moveBox'); g.innerHTML = '';
  const here = pg.folderId == null ? null : pg.folderId;
  const mk = (icon, name, fn, on) => {
    const b = document.createElement('button');
    b.className = 'page folder' + (on ? ' on' : ''); folderCardInner(b, icon, name);
    b.onclick = () => { $('moveOverlay').classList.remove('show'); fn(); };
    g.appendChild(b);
  };
  mk('🏠', '首頁', () => moveTo(pg, null), here === null);
  for (const f of folders) mk('📁', f.name, () => moveTo(pg, f.id), here === f.id);
  mk('📁➕', '新資料夾', async () => {
    const n = await askName('📁', '');
    if (n === null) return;
    const nf = await createFolder(n || '新資料夾');
    moveTo(pg, nf.id);
  });
  $('moveOverlay').classList.add('show');
}
$('moveOverlay').onclick = e => { if (e.target.id === 'moveOverlay') e.currentTarget.classList.remove('show'); };
async function moveTo(pg, fid) {
  pg.folderId = fid;
  if (pg.id != null) { try { await DB.put('pages', pageRec(pg)); } catch (err) { console.warn(err); cheer('⚠️'); } }
  renderPages();
}
async function deletePage(pg) {
  const i = pages.indexOf(pg);
  if (i < 0) return;
  try { if (pg.id != null) await DB.del('pages', pg.id); }
  catch (err) { console.warn(err); cheer('⚠️'); return; }
  const dk = draftKey(pg);
  if (dk) { drafts.delete(dk); DB.del('drafts', dk).catch(() => {}); DB.del('draftmeta', dk).catch(() => {}); }
  pg.gone = true; if (pg === curPg) { dirty = false; clearTimeout(saveT); }
  pages.splice(i, 1);
  if (i === curPage) await loadPage(0);                // 刪掉正在畫的那張 → 回到蘋果
  else if (i < curPage) curPage--;
  renderPages();                                       // 留在首頁，可以繼續整理
}

/* ===================== 8. 啟動 ===================== */
setTool('crayon'); setColor(state.color); layout();
setTimeout(async () => {
  try {                                                // 讀回之前保存的資料夾和線稿
    folders = (await DB.all('folders')).sort((a, b) => a.created - b.created);
    const recs = (await DB.all('pages')).sort((a, b) => a.created - b.created);
    for (const r of recs) pages.push({
      id: r.id, name: '匯入', blob: r.blob, thumb: r.thumb, created: r.created,
      folderId: folderOf(r.folderId) ? r.folderId : null     // 資料夾不見了就回到首頁
    });
  } catch (err) { console.warn(err); }
  try {                                                // 讀回畫到一半的縮圖與完成的作品
    for (const r of await DB.all('draftmeta')) drafts.set(r.key, { thumb: r.thumb });
    works = (await DB.all('works')).sort((a, b) => a.created - b.created);
  } catch (err) { console.warn(err); }
  let first = 0;                                       // 打開 App 時回到上次畫的那一張
  try { const k = localStorage.getItem('coloring-last'); const j = pages.findIndex(pg => draftKey(pg) === k); if (j >= 0) first = j; } catch (_) {}
  loadPage(first);
}, 50);
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
  let waitingSW = null, userUpdate = false, reloading = false;
  const offerUpdate = w => { waitingSW = w; $('updBtn').classList.add('show'); $('homeBtn').classList.add('dot'); };
  navigator.serviceWorker.register('sw.js').then(reg => {
    // 已有舊版在運作、且新版已下載完成在等待 → 顯示更新按鈕
    const check = () => { if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting); };
    check();
    reg.addEventListener('updatefound', () => {
      const n = reg.installing;
      if (n) n.addEventListener('statechange', () => { if (n.state === 'installed') check(); });
    });
    const poll = () => reg.update().catch(() => {});
    setInterval(poll, 30 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (userUpdate && !reloading) { reloading = true; location.reload(); }
  });
  const ub = $('updBtn'), unh = () => ub.classList.remove('hold');
  ub.addEventListener('pointerdown', () => { unh(); void ub.offsetWidth; ub.classList.add('hold'); });
  for (const n of ['pointerup', 'pointercancel', 'pointerleave']) ub.addEventListener(n, unh);
  ub.addEventListener('contextmenu', e => e.preventDefault());
  press(ub, () => showHint('請爸爸媽媽長按約 1.5 秒更新'), () => {
    unh(); if (!waitingSW) return;
    userUpdate = true; waitingSW.postMessage('SKIP_WAITING');
    setTimeout(() => { if (!reloading) { reloading = true; location.reload(); } }, 3000);
  }, 1500);
}
</script>
